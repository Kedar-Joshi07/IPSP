name: Foundation quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked environment and local project
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Run complete test suite
        run: python -m pytest

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run strict mypy
        run: python -m mypy backend/ipsp

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Verify isolated Alembic state
        env:
          IPSP_DATABASE__URL: sqlite:///./ci-ipsp.db
        run: |
          python -m alembic upgrade head
          python -m alembic heads
          python -m alembic current
          python -m alembic check

      - name: Run architecture conformance explicitly
        run: python -m pytest tests/architecture
