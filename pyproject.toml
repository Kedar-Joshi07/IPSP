[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsp"
version = "0.1.1"
description = "Intelligent Predictive Simulation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "IPSP Contributors" }]
dependencies = [
    "alembic>=1.18.5,<2",
    "fastapi>=0.139.2,<0.140",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "pwdlib[argon2]>=0.3.0,<0.4",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn>=0.51.0,<0.52",
]

[project.scripts]
ipsp-create-admin = "ipsp.cli.admin:main"
ipsp-sync-rbac = "ipsp.cli.rbac:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.7.0,<3",
    "mypy>=2.3.0,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.15.22,<0.16",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
ipsp = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["backend/ipsp"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]
